# Contributor CI: run the full Mac Catalyst XCTest suite for app-code pull
# requests. The shared iPhone target compiles for upstream integrations only
# (`upstream-integration` label or upstream/* / sync/upstream-* branch). Its full
# suite requires the explicit `full-iphone-tests` label, including on docs-only
# PRs. Other docs, workflow-only, and version-only PRs skip the macOS runners.
#
# The required branch-protection check is "CI Gate", not "Build and Test":
# a skipped required check would block merges forever, so the gate always
# runs and passes when the suite either succeeded or was legitimately skipped.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Code signing is disabled (CODE_SIGNING_ALLOWED=NO) for CI-only test hosts.
# Manual simulator and Mac validation still use signed Debug builds.

name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Title/body edits must neither cancel validation nor publish a skipped CI
  # Gate (GitHub accepts skipped required jobs). Base edits validate normally.
  group: pr-ci-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base != null) && 'validation' || 'metadata' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
      run_iphone_compile: ${{ steps.filter.outputs.run_iphone_compile }}
      run_iphone_tests: ${{ steps.filter.outputs.run_iphone_tests }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "${files}"
          # Fail closed for application/config changes. Documentation and
          # workflow-only changes do not validate application behavior.
          app_changes=$(echo "${files}" | grep -vE '^(docs/.*|LICENSE|\.gitignore|\.github/.*|.*\.md|UPSTREAM_CLIENT_(INTEGRATED_SHA|ADDITIONAL_COMMITS)|scripts/(compose-upstream-watch-issue|upstream-client-watch|verify-release-notes|test-repo-maintenance\.py))$' || true)

          # A project-file-only marketing/build version bump cannot affect
          # compilation or runtime behavior, so avoid spending two macOS
          # runners on it. Any other project-file edit still fails closed.
          if [[ "${app_changes}" == "HermesMobile.xcodeproj/project.pbxproj" ]]; then
            project_patch=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
              --jq '.[] | select(.filename == "HermesMobile.xcodeproj/project.pbxproj") | (.patch // "")')
            non_version_lines=$(printf '%s\n' "${project_patch}" | awk '
              /^[+-]/ && !/^\+\+\+/ && !/^---/ {
                line = substr($0, 2)
                if (line !~ /^[[:space:]]*(MARKETING_VERSION|CURRENT_PROJECT_VERSION)[[:space:]]*=/) print line
              }
            ')
            if [[ -n "${project_patch}" && -z "${non_version_lines}" ]]; then
              echo "Version-only project change — skipping app validation."
              app_changes=""
            fi
          fi

          if [[ -n "${app_changes}" ]]; then
            echo "Application changes detected — running Mac tests:"
            echo "${app_changes}"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No application behavior changed — skipping Mac app tests."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

          labels=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.labels[].name')
          head_ref="${HEAD_REF}"
          if grep -Fxq "full-iphone-tests" <<< "${labels}"; then
            echo "Full iPhone compatibility validation requested."
            echo "run_iphone_compile=true" >> "$GITHUB_OUTPUT"
            echo "run_iphone_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_iphone_tests=false" >> "$GITHUB_OUTPUT"
            if [[ -n "${app_changes}" ]] && { \
              grep -Fxq "upstream-integration" <<< "${labels}" \
              || [[ "${head_ref}" == upstream/* ]] \
              || [[ "${head_ref}" == sync/upstream-* ]]; }; then
              echo "Upstream integration — compiling the shared iPhone target."
              echo "run_iphone_compile=true" >> "$GITHUB_OUTPUT"
            else
              echo "No iPhone compatibility validation required."
              echo "run_iphone_compile=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  maintenance:
    name: Repository maintenance checks
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Test CI policy, digest and release-note guards
        run: python3 scripts/test-repo-maintenance.py
      - name: Validate curated release notes
        run: |
          set -euo pipefail
          for notes in docs/releases/mac-v*.md; do
            [[ -f "${notes}" ]] || continue
            scripts/verify-release-notes "${notes}"
          done

  test_ios:
    name: iPhone Compatibility
    needs: changes
    if: needs.changes.outputs.run_iphone_compile == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults-iPhone.xcresult
      TEST_WORKER_COUNT: 1

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              device["name"]
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          print(preferred if preferred in phones else phones[0] if phones else "")
          ')
          if [[ -z "${name}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run full compatibility suite when requested
        if: needs.changes.outputs.run_iphone_tests == 'true'
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (${TEST_WORKER_COUNT} workers): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report slowest tests
        if: always() && needs.changes.outputs.run_iphone_tests == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results on failure
        if: failure() && needs.changes.outputs.run_iphone_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore

  test_mac:
    name: Mac Catalyst Build and Test
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData-Mac
      RESULT_BUNDLE_PATH: TestResults-Mac.xcresult

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test Mac Catalyst
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=macOS,arch=arm64,variant=Mac Catalyst" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -enableCodeCoverage NO \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Mac test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore

  gate:
    name: ${{ (github.event.action != 'edited' || github.event.changes.base != null) && 'CI Gate' || 'PR metadata update' }}
    needs: [changes, maintenance, test_ios, test_mac]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        if: github.event.action != 'edited' || github.event.changes.base != null
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "test-ios: ${{ needs.test_ios.result }}"
          echo "test-mac: ${{ needs.test_mac.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          if [[ "${{ needs.maintenance.result }}" != "success" ]]; then
            echo "Repository maintenance checks failed — failing the gate." >&2
            exit 1
          fi
          for result in "${{ needs.test_ios.result }}" "${{ needs.test_mac.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A platform test job did not pass — failing the gate." >&2; exit 1 ;;
            esac
          done
          echo "Gate passed."
